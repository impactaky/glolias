name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Cross-build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Validate version and build all release archives
        env:
          RELEASE_DIR: ${{ runner.temp }}/glolias-release
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/package-release.sh "$version" "$RELEASE_DIR"
          (
            cd "$RELEASE_DIR"
            test "$(find . -maxdepth 1 -type f -name 'glolias-*.tar.gz' | wc -l)" -eq 4
            sha256sum --check SHA256SUMS
          )

      - name: Publish GitHub Release after every artifact is ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/glolias-release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR"/glolias-*.tar.gz \
            "$RELEASE_DIR/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "glolias $GITHUB_REF_NAME"
